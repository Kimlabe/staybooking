# Activate with SPRING_PROFILES_ACTIVE=mysql after preparing the database and user.
spring.datasource.url=${STAYBOOKING_DB_URL}
spring.datasource.username=${STAYBOOKING_DB_USER}
spring.datasource.password=${STAYBOOKING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Apply reviewed SQL changes before deployment; do not mutate the shared schema on startup.
spring.jpa.hibernate.ddl-auto=${STAYBOOKING_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
